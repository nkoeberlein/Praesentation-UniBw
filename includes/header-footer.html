<script>
  function getMeta(name) {
    var el = document.querySelector('meta[name="' + name + '"]');
    return el ? el.content : '';
  }

  function initUbwHeaderFooter() {
    // --- Remove Quarto defaults ---
    var oldFooter = document.querySelector('.footer');
    if (oldFooter) oldFooter.remove();
    var oldNum = document.querySelector('.slide-number');
    if (oldNum) oldNum.style.display = 'none';
    var oldLogo = document.querySelector('.slide-logo');
    if (oldLogo) oldLogo.style.display = 'none';

    var revealEl = document.querySelector('.reveal');
    if (!revealEl) return;

    // --- Read metadata ---
    var author = getMeta('author');
    var authorTitle = getMeta('author-title');
    var position = getMeta('position');
    var expertise = getMeta('expertise');
    var studentId = getMeta('student-id');
    var cohort = getMeta('cohort');
    var email = getMeta('email');
    var profileWebsite = getMeta('profile-website');
    var courseName = getMeta('course-name');
    var courseInstructor = getMeta('course-instructor');
    var university = getMeta('university');
    var faculty = getMeta('faculty');
    var institute = getMeta('institute');
    var chair = getMeta('chair');
    var professor = getMeta('professor');
    var studyProgram = getMeta('study-program');

    var date = getMeta('date');
    if (!date || date.toLowerCase() === 'today') {
      var dateEl = document.querySelector('.date');
      date = dateEl ? dateEl.textContent.trim() : '';
    }
    // Fallback if still 'today' or empty
    if (!date || date.toLowerCase() === 'today') {
      date = new Date().toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
    }
    var titleEl = document.querySelector('.title');
    var title = titleEl ? titleEl.textContent.trim() : '';

      '<span class="ubw-footer-date">' + date + '</span>' +
      '<span class="ubw-footer-sep">&middot;</span>' +
      '<span class="ubw-footer-title">' + title + '</span>' +
      '</span>' +
      '<a class="ubw-footer-num" href="#"></a>';
    revealEl.appendChild(footer);

    // --- Populate steckbrief on end slide ---
    var steckbrief = document.querySelector('.steckbrief');
    if (steckbrief) {
      var html = '';
      if (author) {
        html += '<p class="steck-name">' + (authorTitle ? authorTitle + ' ' : '') + author + '</p>';
      }
      if (position) {
        html += '<p class="steck-position">' + position + '</p>';
      }

      var org = '';
      if (chair) org += chair + '<br>';
      if (institute) org += institute + (faculty ? ' &mdash; ' + faculty : '') + '<br>';
      else if (faculty) org += faculty + '<br>';
      if (university) org += university;

      if (org) {
        html += '<p class="steck-org">' + org + '</p>';
      }

      if (email && email !== '[EMAIL_ADDRESS]') {
        html += '<p class="steck-contact">' + email + '</p>';
      }

      if (profileWebsite) {
        var displayUrl = profileWebsite.replace(/^https?:\/\//, '');
        html += '<p class="steck-website"><a href="' + profileWebsite + '">' + displayUrl + '</a></p>';
      }

      if (expertise) {
        html += '<p class="steck-expertise"><strong>Schwerpunkte:</strong> ' + expertise + '</p>';
      }

      var ids = '';
      if (studentId) ids += 'Matrikelnr. ' + studentId;
      if (cohort) ids += (ids ? ' &mdash; ' : '') + 'Jahrgang ' + cohort;

      if (ids) {
        html += '<p class="steck-ids">' + ids + '</p>';
      }

      steckbrief.innerHTML = html;
    }

    // --- Track last known H1 section name ---
    var lastSectionName = '';

    // --- Visibility: hide header/footer on special slides ---
    function updateChrome() {
      var slide = Reveal.getCurrentSlide();
      if (!slide) return;

      var isTitle = slide.classList.contains('title-slide') || slide === document.querySelector('.slides > section:first-child');
      var isEnd = slide.classList.contains('end-slide');
      var hasBg = slide.hasAttribute('data-background-color');
      var hideHeader = isTitle || hasBg || isEnd;

      header.style.opacity = hideHeader ? '0' : '1';
      header.style.pointerEvents = hideHeader ? 'none' : 'auto';
      footer.style.opacity = isTitle ? '0' : '1';
      footer.style.pointerEvents = isTitle ? 'none' : 'auto';

      // Update header with section title (H1) — remember last seen
      var headerTitle = header.querySelector('.ubw-header-title');
      if (headerTitle) {
        var h1 = slide.querySelector('h1');
        if (h1) lastSectionName = h1.textContent;
        headerTitle.textContent = lastSectionName;
      }

      // Update slide number in footer
      var numEl = footer.querySelector('.ubw-footer-num');
      if (numEl) {
        var total = Reveal.getTotalSlides();
        var current = Reveal.getSlidePastCount() + 1;
        numEl.textContent = 'Folie ' + current + ' / ' + total;
      }

      // Auto-scale: shrink content if it overflows the visible slide area
      if (!isTitle && !isEnd && !hasBg) {
        var headerH = hideHeader ? 0 : header.offsetHeight;
        var footerH = footer.offsetHeight;
        var slideH = slide.offsetHeight;
        var availableH = slideH - headerH - footerH;
        slide.style.transform = '';
        slide.style.transformOrigin = '';
        var contentH = slide.scrollHeight;
        if (contentH > availableH && availableH > 0) {
          var scale = availableH / contentH;
          if (scale < 0.55) scale = 0.55;
          slide.style.transformOrigin = 'top center';
          slide.style.transform = 'scale(' + scale + ')';
        }
      } else {
        slide.style.transform = '';
        slide.style.transformOrigin = '';
      }
    }

    updateChrome();
    Reveal.on('slidechanged', updateChrome);
  }


  // Handle all timing scenarios
  if (typeof Reveal !== 'undefined' && Reveal.isReady()) {
    initUbwHeaderFooter();
  } else if (typeof Reveal !== 'undefined') {
    Reveal.on('ready', initUbwHeaderFooter);
  } else {
    document.addEventListener('DOMContentLoaded', function () {
      if (typeof Reveal !== 'undefined' && Reveal.isReady()) {
        initUbwHeaderFooter();
      } else if (typeof Reveal !== 'undefined') {
        Reveal.on('ready', initUbwHeaderFooter);
      }
    });
  }
</script>
